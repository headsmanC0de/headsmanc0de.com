<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="logo-title">
	<title id="logo-title">Nazariy Petryk — developer at laptop logo</title>
	<!-- rounded black square -->
	<rect width="64" height="64" rx="14" fill="#000000"/>
	<!-- head -->
	<circle cx="32" cy="18.5" r="7.5" fill="#ffffff"/>
	<!-- shoulders / torso -->
	<path d="M19.5 42c0-7.5 5.6-12.5 12.5-12.5S44.5 34.5 44.5 42v1h-25Z" fill="#ffffff"/>
	<!-- laptop gap (cut-out) -->
	<rect x="16.5" y="32.5" width="31" height="18" rx="3" fill="#000000"/>
	<!-- laptop screen (back) -->
	<rect x="19.5" y="35.5" width="25" height="11.5" rx="2" fill="#ffffff"/>
	<!-- laptop base -->
	<rect x="15.5" y="49.5" width="33" height="3.5" rx="1.75" fill="#ffffff"/>
</svg>
